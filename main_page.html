<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Olivarez Navigation Portal</title>

    <!-- Entry gate: every visit passes through index.html once per tab, so the visitor
         always picks location on/off first. A QR link (?from=<building>) is carried along.
         index.html adds loc=on|off when it sends the visitor back here, so this never loops. -->
    <script>
      (function () {
        try {
          var mode = new URLSearchParams(window.location.search).get("loc");
          if (mode === "on" || mode === "off") return;
          if (sessionStorage.getItem("ocnpLoc")) return;
          window.location.replace("index.html" + window.location.search);
        } catch (e) {}
      })();
    </script>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Leaflet Rotate Plugin CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.css"
    />

    <!-- FontAwesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/design.css" />
  </head>
  <body>
    <!-- Floating search bar with hamburger on the left -->
    <header class="app-header" id="appHeader" data-mode="search">
      <div class="header-search" id="headerSearch">
        <button
          type="button"
          class="menu-btn"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="sideDrawer"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <div class="search-container">
          <input
            type="search"
            class="search-input"
            id="searchInput"
            placeholder="Search location..."
            aria-label="Search map"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="buildingsList"
          />
          <button
            type="button"
            class="search-btn"
            id="searchBtn"
            aria-label="Search"
          >
            <i
              class="fa-solid fa-magnifying-glass"
              id="searchIcon"
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>
      <section
        class="trip-card"
        id="tripCard"
        data-origin="pin"
        aria-label="Walking route"
      >
        <button
          type="button"
          class="trip-back"
          id="tripBackBtn"
          aria-label="Clear route"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>
        <div class="trip-points">
          <button type="button" class="trip-row" id="tripFromBtn">
            <span class="trip-marker"><span class="trip-dot"></span></span
            ><span class="sr-only">From: </span
            ><span class="trip-text" id="tripFromText">Your location</span>
          </button>
          <button type="button" class="trip-row trip-row-to" id="tripToBtn">
            <span class="trip-marker"
              ><i
                class="fa-solid fa-flag-checkered"
                aria-hidden="true"
              ></i></span
            ><span class="sr-only">To: </span
            ><span class="trip-text" id="tripToText">Destination</span>
          </button>
        </div>
        <div class="trip-summary">
          <span class="trip-time" id="tripTime">1 min</span
          ><span class="trip-dist" id="tripDist">0 m</span>
        </div>
      </section>
      <!-- Inline search dropdown -->
      <div class="search-dropdown" id="searchDropdown">
        <ul
          class="buildings-list"
          id="buildingsList"
          role="listbox"
          aria-label="Campus locations"
        >
          <!-- Populated dynamically, alphabetically -->
        </ul>
      </div>
    </header>

    <!-- Where you start (QR / location). The route itself lives in the trip card above. -->
    <div class="status-stack" id="statusStack">
      <div class="status-chip here-chip" id="hereChip" hidden>
        <i
          class="fa-solid fa-location-dot"
          id="hereChipIcon"
          aria-hidden="true"
        ></i>
        <span id="hereChipText"></span>
        <button
          type="button"
          id="clearOriginBtn"
          aria-label="Clear starting point"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div
      class="sr-only"
      id="routeAnnouncer"
      role="status"
      aria-live="polite"
    ></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Side navigation overlay and drawer -->
    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-label="Main menu">
      <div class="drawer-header">
        <h2>OCNP</h2>
        <button
          type="button"
          class="close-btn"
          id="closeDrawer"
          aria-label="Close menu"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <ul class="drawer-menu">
        <li>
          <button type="button" id="themeToggleBtn">
            <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
            <span id="themeLabel">Dark Mode</span>
          </button>
        </li>
        <li>
          <button type="button" id="feedbackLink">
            <i class="fa-solid fa-envelope-open" aria-hidden="true"></i>Feedback
          </button>
        </li>
        <li>
          <button type="button" id="aboutLink">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>About Us /
            Contact Us
          </button>
        </li>
        <li>
          <button type="button" id="attributionsLink">
            <i class="fa-solid fa-users" aria-hidden="true"></i>Attributions
          </button>
        </li>
      </ul>
    </nav>

    <!-- Feedback modal -->
    <div class="modal-overlay" id="feedbackModal">
      <div
        class="feedback-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="feedbackTitle"
      >
        <div class="modal-header">
          <h3 id="feedbackTitle">
            <i class="fa-solid fa-comments" aria-hidden="true"></i> Send
            Feedback
          </h3>
          <button
            type="button"
            class="modal-close-btn"
            id="closeFeedbackBtn"
            aria-label="Close feedback"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <form id="feedbackForm">
          <div class="form-group">
            <label for="userEmail"
              ><i class="fa-regular fa-envelope" aria-hidden="true"></i>
              Email</label
            >
            <input
              type="email"
              id="userEmail"
              class="form-input"
              placeholder="enter your email here"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="feedbackSubject"
              ><i class="fa-solid fa-tag" aria-hidden="true"></i> Subject</label
            >
            <input
              type="text"
              id="feedbackSubject"
              class="form-input"
              placeholder="enter subject here"
              required
            />
          </div>

          <div class="form-group">
            <label for="feedbackMessage"
              ><i class="fa-solid fa-message" aria-hidden="true"></i>
              Feedback</label
            >
            <textarea
              id="feedbackMessage"
              class="form-textarea"
              placeholder="enter your feedback here..."
              rows="4"
              required
            ></textarea>
          </div>

          <button type="submit" class="send-btn" id="sendFeedbackBtn">
            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send
            Feedback
          </button>
        </form>
      </div>
    </div>

    <!-- Feedback sent success popup -->
    <div class="modal-overlay" id="successModal">
      <div
        class="success-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="successTitle"
        aria-describedby="successText"
      >
        <div class="success-icon">
          <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        </div>
        <h3 id="successTitle">Feedback Sent!</h3>
        <p id="successText">
          Thank you for helping us improve OCNP. Your message has been sent to
          support.
        </p>
        <button type="button" class="popup-close-btn" id="closeSuccessBtn">
          Close &amp; Return to Map
        </button>
      </div>
    </div>

    <!-- Generic info modal for About and Attributions -->
    <div class="modal-overlay" id="infoModal">
      <div
        class="feedback-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="infoModalTitle"
      >
        <div class="modal-header">
          <h3 id="infoModalTitle">Info</h3>
          <button
            type="button"
            class="modal-close-btn"
            id="closeInfoBtn"
            aria-label="Close info"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div id="infoModalBody" class="info-modal-body">
          <!-- Dynamic content -->
        </div>
      </div>
    </div>

    <!-- Map container -->
    <div id="oc_map" role="region" aria-label="Campus map"></div>

    <!-- Bottom-right controls -->
    <div class="map-controls-container">
      <div class="floor-control" id="floorControl">
        <div
          class="floor-menu"
          id="floorMenu"
          role="radiogroup"
          aria-label="Choose floor"
        >
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="true"
            data-floor="m"
            aria-label="Main floor"
            title="Main"
          >
            M
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f1"
            aria-label="Floor 1"
            title="Floor 1"
          >
            F1
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f2"
            aria-label="Floor 2"
            title="Floor 2"
          >
            F2
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f3"
            aria-label="Floor 3"
            title="Floor 3"
          >
            F3
          </button>
        </div>
        <button
          type="button"
          class="map-control-btn"
          id="floorBtn"
          aria-label="Choose floor"
          aria-haspopup="true"
          aria-expanded="false"
          title="Floors"
        >
          <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
          <span class="floor-badge" id="floorBadge" aria-hidden="true"></span>
        </button>
      </div>

      <button
        type="button"
        class="map-control-btn"
        id="toggleLabelsBtn"
        aria-label="Toggle building labels"
        aria-pressed="false"
        title="Toggle building labels"
      >
        <i class="fa-solid fa-font" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="map-control-btn my-location-btn"
        id="myLocationBtn"
        aria-label="Go to my location"
        title="Go to my location"
      >
        <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Swipeable bottom sheet -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>
    <div
      class="bottom-sheet"
      id="bottomSheet"
      role="dialog"
      aria-labelledby="sheetTitle"
      inert
    >
      <!-- Drag handle area -->
      <div class="sheet-drag-area" id="sheetDragArea">
        <button
          type="button"
          class="sheet-handle-btn"
          id="sheetToggleBtn"
          aria-label="Expand details"
          aria-expanded="false"
          aria-controls="sheetContent"
        >
          <span class="sheet-handle"></span>
        </button>
        <div class="sheet-header">
          <!-- Top Row: Full building name and close button -->
          <div class="sheet-header-top">
            <div class="sheet-header-left">
              <h3 id="sheetTitle" tabindex="-1">Building Title</h3>
            </div>
            <button
              type="button"
              class="sheet-close-btn"
              id="closeSheetBtn"
              aria-label="Close details"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <!-- Bottom Row: Estimated Time & Distance Badges -->
          <div class="sheet-header-right">
            <span class="sheet-stat-badge" id="sheetTimeBadge" hidden>
              <i class="fa-regular fa-clock" aria-hidden="true"></i>
              <span id="sheetTimeText">0 min</span>
            </span>
            <span class="sheet-stat-badge" id="sheetDistanceBadge" hidden>
              <i class="fa-solid fa-person-walking" aria-hidden="true"></i>
              <span id="sheetDistanceText">0 m</span>
            </span>
            <button
              type="button"
              class="sheet-pill-btn"
              id="startHereBtn"
              hidden
            >
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i> Start
              from here
            </button>
          </div>
        </div>
        <!-- Action button -->
        <button type="button" class="destination-btn" id="goToDestinationBtn">
          <i class="fa-solid fa-location-arrow" aria-hidden="true"></i> Go to
          Destination
        </button>
      </div>

      <!-- Scrollable content -->
      <div class="sheet-content" id="sheetContent">
        <div class="sheet-images-gallery" id="sheetImagesGallery">
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 1</span>
            </div>
            <img id="sheetImage1" alt="" />
          </div>
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 2</span>
            </div>
            <img id="sheetImage2" alt="" />
          </div>
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 3</span>
            </div>
            <img id="sheetImage3" alt="" />
          </div>
        </div>

        <p class="sheet-description" id="sheetDescription">
          Building description text goes here...
        </p>

        <!-- Floor dropdowns (shown for the ELO building only) -->
        <div class="floor-list" id="floorList" hidden></div>
      </div>
    </div>

    <!-- Libraries -->

      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

      crossorigin=""
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.12.1/dist/email.min.js"></script>

      function onTouchStart(e) {
        if (
          !(e.target.closest("#sheetDragArea") || sheetContent.scrollTop === 0)
        )

        isDragging = true;
        startY = currentY = e.touches[0].clientY;

        if (currentSnapState === "expanded") {
          initialTransformY = 0;
        } else if (currentSnapState === "peek") {
          initialTransformY = getPeekOffsetY();
        } else {
          initialTransformY = window.innerHeight;
        }

        bottomSheet.classList.add("dragging");
        bottomSheet.style.transition = "none";
      }

      function onTouchMove(e) {
        if (!isDragging) return;
        currentY = e.touches[0].clientY;
        const newTransformY = Math.max(
          0,
          initialTransformY + (currentY - startY),
        );
        bottomSheet.style.transform = `translateY(${newTransformY}px)`;
      }

      function onTouchEnd() {
        if (!isDragging) return;
        isDragging = false;

        const deltaY = currentY - startY;

        if (currentSnapState === "peek") {
          if (deltaY < -60) snapToState("expanded");
          else if (deltaY > 60) snapToState("closed");
          else snapToState("peek");
        } else if (currentSnapState === "expanded") {
          if (deltaY > 120) snapToState("closed");
          else if (deltaY > 50) snapToState("peek");
          else snapToState("expanded");
        } else {
          snapToState(deltaY < -100 ? "peek" : "closed");
        }
      }

        passive: true,

      /* GeoJSON Buildings */
      const NON_NAME_KEYS = ["entrances", "perimeter", "walkway"];

      campusBuildings.sort((a, b) => a.title.localeCompare(b.title));

      /* ==========================================================
           Walkway graph & pathfinding
           ========================================================== */
      const KX = 111320 * Math.cos((14.479 * Math.PI) / 180);
      const KY = 110574;
      const toM = (lng, lat) => [lng * KX, lat * KY];
      const toLL = (p) => L.latLng(p[1] / KY, p[0] / KX);

      function projectOnSeg(p, a, b) {
        const dx = b[0] - a[0],
          dy = b[1] - a[1],
          len2 = dx * dx + dy * dy;
        const t = len2
          ? Math.max(
              0,
              Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2),
            )
          : 0;
        const q = [a[0] + t * dx, a[1] + t * dy];
        return { t, d: Math.hypot(p[0] - q[0], p[1] - q[1]), p: q };
      }

      const gNodes = []; // [x, y] in metres
      const gAdj = []; // gAdj[i] = [{ to, w }]
      const gEdges = []; // [{ a, b, w }], one per walkable segment (used to snap GPS positions)
      const gEdgeKeys = new Set();
      let gComp = []; // connected-component id per node
      let gMainComp = -1; // the largest component; only this one is ever used for routing

      function nodeFor(p) {
        for (let i = 0; i < gNodes.length; i++) {
          if (Math.hypot(gNodes[i][0] - p[0], gNodes[i][1] - p[1]) < NODE_M)
            return i;
        }
        gNodes.push(p);
        gAdj.push([]);
        return gNodes.length - 1;
      }

      function addEdge(a, b) {
        if (a === b) return;
        const key = a < b ? `${a}-${b}` : `${b}-${a}`;
        if (gEdgeKeys.has(key)) return;
        gEdgeKeys.add(key);
        const w = Math.hypot(
          gNodes[a][0] - gNodes[b][0],
          gNodes[a][1] - gNodes[b][1],
        );
        gAdj[a].push({ to: b, w });
        gAdj[b].push({ to: a, w });
        gEdges.push({ a, b, w });
      }

      (function buildWalkGraph() {
        const lines = geojsonData.features
          .filter(
            (f) => f.properties.walkway && f.geometry.type === "LineString",
          )
          .map((f) => f.geometry.coordinates.map((c) => toM(c[0], c[1])));

        lines.forEach((pts, li) => {
          let prev = null;
          const visit = (p) => {
            const id = nodeFor(p);
            if (prev !== null) addEdge(prev, id);
            prev = id;
          };

          visit(pts[0]);
          for (let s = 0; s < pts.length - 1; s++) {
            const a = pts[s],
              b = pts[s + 1],
              extra = [];
            // A vertex of another line that sits on this segment is a junction
            lines.forEach((other, lj) => {
              if (lj === li) return;
              other.forEach((v) => {
                const { t, d } = projectOnSeg(v, a, b);
                if (d < JUNCTION_M && t > 0.02 && t < 0.98)
                  extra.push({ t, v });
              });
            });
            extra.sort((x, y) => x.t - y.t).forEach((e) => visit(e.v));
            visit(b);
          }
        });
      })();

      (function labelComponents() {
        gComp = new Array(gNodes.length).fill(-1);
        const sizes = [];
        for (let s = 0; s < gNodes.length; s++) {
          if (gComp[s] !== -1) continue;
          const id = sizes.length;
          let size = 0;
          const stack = [s];
          gComp[s] = id;
          while (stack.length) {
            const u = stack.pop();
            size++;
            gAdj[u].forEach(({ to }) => {
              if (gComp[to] === -1) {
                gComp[to] = id;
                stack.push(to);
              }
            });
          }
          sizes.push(size);
        }
        gMainComp = sizes.indexOf(Math.max(...sizes));
        if (sizes.length > 1) {
          console.warn(
            `Walkway network has ${sizes.length} separate pieces; only the largest is used.`,
          );
        }
      })();

      function nearestNode(latlng, maxM = ENTRANCE_SNAP_M) {
        const p = toM(latlng.lng, latlng.lat);
        let best = null;
        for (let i = 0; i < gNodes.length; i++) {
          if (gComp[i] !== gMainComp) continue;
          const d = Math.hypot(gNodes[i][0] - p[0], gNodes[i][1] - p[1]);
          if (d <= maxM && (!best || d < best.d)) best = { node: i, d };
        }
        return best;
      }

      function snapToNetwork(latlng, maxM) {
        const p = toM(latlng.lng, latlng.lat);
        let best = null;
        for (const e of gEdges) {
          if (gComp[e.a] !== gMainComp) continue;
          const { t, d, p: q } = projectOnSeg(p, gNodes[e.a], gNodes[e.b]);
          if (d <= maxM && (!best || d < best.d))
            best = { edge: e, t, d, point: q };
        }
        return best;
      }

      /* A "source" is where a route can start, a "target" where it can end.
           leg = metres from the real point to the walkway node, lead/tail = the polyline for that leg. */
      function doorSource(latlng) {
        const hit = nearestNode(latlng);
        return hit ? { node: hit.node, leg: hit.d, lead: [latlng] } : null;
      }

      function doorTarget(latlng) {
        const hit = nearestNode(latlng);
        return hit ? { node: hit.node, leg: hit.d, tail: [latlng] } : null;
      }

      /* A GPS fix is snapped to the nearest point ALONG a walkway, so it can start mid-segment */
      function gpsSources(latlng) {
        const snap = snapToNetwork(latlng, MAX_OFF_NETWORK_M);
        if (!snap) return null;
        const { edge, t, d, point } = snap;
        const lead = [latlng, toLL(point)];
        return [
          { node: edge.a, leg: d + t * edge.w, lead },
          { node: edge.b, leg: d + (1 - t) * edge.w, lead },
        ];
      }

      /* Multi-source Dijkstra: finds the best (source, target) pair in one pass */
      function planRoute(sources, targets) {
        const n = gNodes.length;
        const dist = new Array(n).fill(Infinity);
        const prev = new Array(n).fill(-1);
        const root = new Array(n).fill(-1);
        const done = new Array(n).fill(false);

        sources.forEach((s, i) => {
          if (s.leg < dist[s.node]) {
            dist[s.node] = s.leg;
            root[s.node] = i;
          }
        });

        for (;;) {
          let u = -1;
          for (let i = 0; i < n; i++) {
            if (
              !done[i] &&
              dist[i] < Infinity &&
              (u === -1 || dist[i] < dist[u])
            )
              u = i;
          }
          if (u === -1) break;
          done[u] = true;
          for (const { to, w } of gAdj[u]) {
            if (dist[u] + w < dist[to]) {
              dist[to] = dist[u] + w;
              prev[to] = u;
              root[to] = root[u];
            }
          }
        }

        let best = null;
        targets.forEach((t) => {
          const total = dist[t.node] + t.leg;
          if (total < Infinity && (!best || total < best.total))
            best = { t, total };
        });
        if (!best) return null;

        const nodes = [];
        for (let u = best.t.node; u !== -1; u = prev[u]) nodes.push(u);
        nodes.reverse();
        const src = sources[root[nodes[0]]];

        return {
          distance: best.total,
          path: [
            ...src.lead,
            ...nodes.map((i) => toLL(gNodes[i])),
            ...best.t.tail,
          ],
          start: src.lead[0],
          snap: src.lead.length > 1 ? src.lead[src.lead.length - 1] : null,
          end: best.t.tail[best.t.tail.length - 1],
        };
      }

      /* origin is { source: 'qr' | 'manual', building, points } or { source: 'gps', latlng } */
      function computeRoute(origin, target) {
        let sources;
        if (origin.source === "gps") {
          sources = gpsSources(origin.latlng);
          if (!sources) {
            return {
              error:
                "You seem to be away from the campus walkways. Move closer, or scan the QR code at your building.",
            };
          }
        } else {
          sources = origin.points.map(doorSource).filter(Boolean);
          if (!sources.length)
            return {
              error: `Can't find a walkway near ${origin.building.title}.`,
            };
        }

        const targets = target.entrances.map(doorTarget).filter(Boolean);
        if (!targets.length)
          return { error: `Can't find a walkway near ${target.title}.` };

        const route = planRoute(sources, targets);
        if (!route)
          return { error: `No walkable path found to ${target.title}.` };

        /* Like Google Maps: a walker close to a walkway is drawn ON it, and the line starts at the dot,
           so the part already walked disappears behind them. */
        if (origin.source === "gps" && route.snap) {
          const off = origin.latlng.distanceTo(route.snap);
          if (off <= SNAP_DOT_M) {
            route.path = route.path.slice(1);
            route.start = route.snap;
            route.dot = route.snap;
            route.distance = Math.max(0, route.distance - off);
          }
        }
        return { route };
      }

      /* Route state & display */
      const STYLE_HERE = {
        color: "#f59e0b",
        weight: 3,
        fillColor: "#f59e0b",
        fillOpacity: 0.45,
      };
      const STYLE_DEST = {
        color: "#2563eb",
        weight: 3,
        fillColor: "#2563eb",
        fillOpacity: 0.35,
      };

      /* Google-Maps style "you are here": blue dot + a beam that points where the phone is facing.
         .gm-center / .gm-axis are invisible probes used to measure the icon's real on-screen rotation. */
      const USER_ICON = L.divIcon({
        className: "gm-user",
        html: '<div class="gm-beam"></div><div class="gm-dot"></div><i class="gm-center"></i><i class="gm-axis"></i>',
        iconSize: [64, 64],
        iconAnchor: [32, 32],
      });
      /* Invisible marker 40 m north of the dot, used to find where north points on a rotated map */
      const NORTH_REF_ICON = L.divIcon({
        className: "gm-ref",
        html: "",
        iconSize: [2, 2],
        iconAnchor: [1, 1],
      });
      const HERE_ICON = L.divIcon({
        className: "here-marker",
        html: "<span></span>",
        iconSize: [44, 44],
        iconAnchor: [22, 22],
      });
      const END_ICON = L.divIcon({
        className: "route-end-marker",
        html: '<span><i class="fa-solid fa-flag-checkered" aria-hidden="true"></i></span>',
        iconSize: [30, 30],
        iconAnchor: [15, 15],
      });

      const hereChip = $("hereChip");
      const hereChipIcon = $("hereChipIcon");
      const hereChipText = $("hereChipText");
      const clearOriginBtn = $("clearOriginBtn");
      const appHeader = $("appHeader");
      const tripCard = $("tripCard");
      const tripFromBtn = $("tripFromBtn");
      const tripFromText = $("tripFromText");
      const tripToBtn = $("tripToBtn");
      const tripToText = $("tripToText");
      const tripTime = $("tripTime");
      const tripDist = $("tripDist");
      const routeAnnouncer = $("routeAnnouncer");
      const startHereBtn = $("startHereBtn");
      const toastEl = $("toast");

      let pinnedOrigin = null; // set by a QR scan or "Start from here"; always wins over GPS
      let hereMarker = null;
      let routeLine = null;
      let routeCasing = null;
      let routeStartDot = null;
      let routeEndMarker = null;
      let routeTarget = null;
      let routeState = null; // { target, originSource, from, distance }
      let pendingTarget = null; // destination to route to as soon as a GPS fix arrives
      let arrivedFor = null;
      let toastTimer = null;
      let navDot = null; // where the dot is drawn while navigating (pinned to the walkway)
      let locMode = null; // "on" | "off" | null, from the index page
      let lastOriginKind = null; // "gps" | "pin" | null

      const gps = {
        watchId: null,
        fix: null,
        recenter: false,
        denied: false,
        lastErrorAt: 0,
        weakNotified: false,
      };

      function storeGet(key) {
        try {
          return sessionStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }
      function storeSet(key, value) {
        try {
          sessionStorage.setItem(key, value);
        } catch (e) {}
      }
      function storeRemove(key) {
        try {
          sessionStorage.removeItem(key);
        } catch (e) {}
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 4000);
      }

      function formatRoute(distance) {
        return {
          metres: Math.round(distance),
          minutes: Math.max(1, Math.round(distance / WALK_SPEED_MS / 60)),
        };
      }

      function gpsIsUsable() {
        return !!(gps.fix && gps.fix.accuracy <= GPS_MAX_ACCURACY_M);
      }

      function gpsOnCampus() {
        return (
          gpsIsUsable() && !!snapToNetwork(gps.fix.latlng, MAX_OFF_NETWORK_M)
        );
      }

      /* Where does a new route start?
         1. "Start from here" (manual) always wins.
         2. Live location, once it is accurate and on the campus walkways.
         3. The QR code's building: the stand-in while location is off, still searching, or weak. */
      function getOrigin() {
        if (pinnedOrigin && pinnedOrigin.source === "manual")
          return pinnedOrigin;
        if (gpsOnCampus())
          return {
            source: "gps",
            latlng: gps.fix.latlng,
            accuracy: gps.fix.accuracy,
          };
        return pinnedOrigin;
      }

      function pinIsActive() {
        const o = getOrigin();
        return !!o && o.source !== "gps";
      }

      function applyHighlights() {
        campusBuildings.forEach((b) => geoLayer.resetStyle(b.layer));
        const pin = pinIsActive();
        if (pin) pinnedOrigin.building.layer.setStyle(STYLE_HERE);
        if (routeTarget) routeTarget.layer.setStyle(STYLE_DEST);
        if (hereMarker) hereMarker.setOpacity(pin ? 1 : 0);
      }

      /* Called whenever the fix changes: switches between "QR building" and "live location" */
      function refreshOriginMode() {
        const o = getOrigin();
        const kind = o ? (o.source === "gps" ? "gps" : "pin") : null;
        if (kind === lastOriginKind) return;
        lastOriginKind = kind;
        applyHighlights();
        updateHereChip();
        refreshSheetActions();
      }

      function updateDestinationBtn() {
        const b = activeBuildingData;
        let icon = "fa-location-arrow",
          label = "Go to Destination",
          disabled = false;
        if (b && pinIsActive() && pinnedOrigin.building === b) {
          icon = "fa-location-dot";
          label = "You are here";
          disabled = true;
        } else if (b && routeTarget === b) {
          icon = "fa-xmark";
          label = "Clear route";
        }
        goToDestinationBtn.innerHTML = `<i class="fa-solid ${icon}" aria-hidden="true"></i> ${label}`;
        goToDestinationBtn.disabled = disabled;
      }

      function updateStartHereBtn() {
        const b = activeBuildingData;
        startHereBtn.hidden =
          !b || !!(pinIsActive() && pinnedOrigin.building === b);
      }

      /* Time and distance badges only belong to the building the route leads to */
      function updateSheetStats() {
        const show = !!(routeState && activeBuildingData === routeState.target);
        sheetTimeBadge.hidden = !show;
        sheetDistanceBadge.hidden = !show;
        if (show) {
          const { metres, minutes } = formatRoute(routeState.distance);
          sheetDistanceText.textContent = `${metres} m`;
          sheetTimeText.textContent = `${minutes} min`;
        }
      }

      function refreshPeek() {
        if (currentSnapState === "peek") snapToState("peek");
      }

      function refreshSheetActions() {
        updateDestinationBtn();
        updateStartHereBtn();
        updateSheetStats();
        refreshPeek();
      }

      function updateHereChip() {
        let text = "",
          icon = "fa-location-dot",
          label = "",
          gpsMode = false;
        const o = getOrigin();
        if (o && o.source === "gps") {
          gpsMode = true;
          icon = "fa-location-crosshairs";
          text = `Using your location · ±${Math.round(gps.fix.accuracy)} m`;
          label = "Turn off location";
        } else if (pinnedOrigin) {
          text = `You are at ${pinnedOrigin.building.title}`;
          if (gps.watchId !== null)
            text += gps.fix
              ? " · waiting for a better GPS fix"
              : " · finding exact location…";
          label = "Clear starting point";
        } else if (gps.fix) {
          gpsMode = true;
          icon = "fa-location-crosshairs";
          const acc = Math.round(gps.fix.accuracy);
          text = gpsIsUsable()
            ? `Not on the campus walkways · ±${acc} m`
            : `Weak GPS signal · ±${acc} m`;
          label = "Turn off location";
        } else if (gps.watchId !== null) {
          gpsMode = true;
          icon = "fa-location-crosshairs";
          text = "Finding your location…";
          label = "Turn off location";
        }
        hereChip.hidden = !text || !!routeState;
        hereChip.classList.toggle("is-gps", gpsMode);
        hereChipIcon.className = `fa-solid ${icon}`;
        hereChipText.textContent = text;
        clearOriginBtn.setAttribute("aria-label", label || "Clear");
      }

      /* The search bar turns into a compact trip card (from / to / time) while a route is showing */
      function doorLabel(name) {
        return String(name).replace(/^entrance\s*(\d+)$/i, "Entrance $1");
      }

      function fromLabel(origin) {
        if (origin.source === "gps") return "Your location";
        return origin.door
          ? `${origin.building.title} · ${doorLabel(origin.door.name)}`
          : origin.building.title;
      }

      function updateTripCard(origin, target, distance) {
        const { metres, minutes } = formatRoute(distance);
        tripFromText.textContent = fromLabel(origin);
        tripToText.textContent = target.title;
        tripTime.textContent =
          distance <= ARRIVE_M ? "Arrived" : `${minutes} min`;
        tripDist.textContent = `${metres} m`;
        tripCard.dataset.origin = origin.source === "gps" ? "gps" : "pin";
      }

      function setTripMode(on) {
        if (!on && tripCard.contains(document.activeElement)) {
          (currentSnapState !== "closed" ? sheetTitle : menuToggle).focus({
            preventScroll: true,
          });
        }
        appHeader.dataset.mode = on ? "trip" : "search";
        document.body.classList.toggle("trip-mode", on);
        if (on) setDropdownOpen(false);
      }

      function removeRouteLayers() {
        [routeLine, routeCasing, routeStartDot, routeEndMarker].forEach(
          (layer) => {
            if (layer) oc_map.removeLayer(layer);
          },
        );
        routeLine = routeCasing = routeStartDot = routeEndMarker = null;
      }

      function clearRoute() {
        removeRouteLayers();
        routeTarget = null;
        routeState = null;
        pendingTarget = null;
        arrivedFor = null;
        navDot = null;
        setTripMode(false);
        stopFollow();
        follow.dismissed = false;
        if (gps.fix) drawUserMarker(); // the dot goes back to the real fix
        updateHereChip();
        applyHighlights();
        refreshSheetActions();
      }

      function fitRoute() {
        if (!routeLine) return;
        const bottom =
          currentSnapState === "closed" ? 40 : getPeekHeight() + 40;
        const cardHeight =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--trip-height",
            ),
          ) || 104;
        const top =
          (parseFloat(getComputedStyle(appHeader).top) || 12) + cardHeight + 16;
        oc_map.fitBounds(routeLine.getBounds(), {
          paddingTopLeft: [40, top],
          paddingBottomRight: [40, bottom],
          maxZoom: 20,
        });
      }

      function drawRoute(route, origin, target, fit) {
        const prev =
          routeState && routeState.target === target ? routeState : null;
        const began =
          prev && prev.began
            ? prev.began
            : origin.source === "gps"
              ? origin.latlng
              : null;
        const inPlace =
          !fit &&
          routeLine &&
          origin.source === "gps" &&
          prev &&
          prev.originSource === "gps";

        if (inPlace) {
          /* Live navigation: just move the line, no flicker */
          routeCasing.setLatLngs(route.path);
          routeLine.setLatLngs(route.path);
          routeEndMarker.setLatLng(route.end);
        } else {
          removeRouteLayers();
          routeCasing = L.polyline(route.path, {
            color: "#ffffff",
            weight: 10,
            opacity: 0.9,
            lineCap: "round",
            lineJoin: "round",
            interactive: false,
          }).addTo(oc_map);
          routeLine = L.polyline(route.path, {
            color: "#0B793D",
            weight: 3,
            opacity: 1,
            lineCap: "round",
            lineJoin: "round",
            interactive: false,
          }).addTo(oc_map);
          if (origin.source !== "gps") {
            routeStartDot = L.circleMarker(route.start, {
              radius: 6,
              color: "#0B793D",
              weight: 3,
              fillColor: "#ffffff",
              fillOpacity: 1,
              interactive: false,
            }).addTo(oc_map);
          }
          routeEndMarker = L.marker(route.end, {
            icon: END_ICON,
            interactive: false,
            keyboard: false,
          }).addTo(oc_map);
        }

        navDot = origin.source === "gps" ? route.dot || origin.latlng : null;
        routeTarget = target;
        routeState = {
          target,
          originSource: origin.source,
          from: origin.source === "gps" ? origin.latlng : null,
          began,
          distance: route.distance,
        };

        updateTripCard(origin, target, route.distance);
        setTripMode(true);
        updateHereChip();

        applyHighlights();
        refreshSheetActions();
        if (fit) {
          const { metres, minutes } = formatRoute(route.distance);
          routeAnnouncer.textContent = `Route to ${target.title}: ${metres} metres, about ${minutes} minute${minutes === 1 ? "" : "s"} on foot.`;
          fitRoute();
        }
      }

      function checkArrival(route, target) {
        if (route.distance <= ARRIVE_M && arrivedFor !== target) {
          arrivedFor = target;
          showToast(`You have arrived at ${target.title}.`);
          stopFollow();
        }
      }
      /* Why there is no starting point yet, and what to do about it */
      function needOrigin(target) {
        gps.weakNotified = false;
        if (
          gps.watchId === null &&
          locMode !== "off" &&
          !gps.denied &&
          locationSupported(true)
        ) {
          pendingTarget = target;
          showToast("Finding your location…");
          startLocation({ recenter: false });
        } else if (gps.watchId !== null && !gps.fix) {
          pendingTarget = target;
          showToast("Still finding your location…");
        } else if (gps.fix) {
          pendingTarget = target;
          showToast(
            gpsIsUsable()
              ? "You seem to be away from the campus walkways. Scan a QR code, or tap “Start from here” on your building."
              : `GPS signal is weak (±${Math.round(gps.fix.accuracy)} m). Waiting for a better fix, or scan a QR code / tap “Start from here”.`,
          );
        } else {
          showToast(
            "Scan a QR code, or tap “Start from here” on your building, to get directions.",
          );
        }
        return false;
      }

      function routeTo(target) {
        const origin = getOrigin();
        if (!origin) return needOrigin(target);
        if (origin.building === target) {
          showToast("You are already here.");
          return false;
        }

        const result = computeRoute(origin, target);
        if (result.error) {
          showToast(result.error);
          return false;
        }

        arrivedFor = null;
        drawRoute(result.route, origin, target, true);
        checkArrival(result.route, target);
        return true;
      }

      goToDestinationBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        enableCompass(); // a tap is needed to unlock the compass on iPhones
        const target = activeBuildingData;
        if (!target) return;
        if (routeTarget === target) {
          clearRoute();
          return;
        }
        routeTo(target);
      });

      $("tripBackBtn").addEventListener("click", clearRoute);

      /* Tap the destination row to bring its details back; tap the start row to look at where you start */
      tripToBtn.addEventListener("click", () => {
        if (!routeTarget) return;
        if (routeTarget.coords)
          oc_map.flyTo([routeTarget.coords.lat, routeTarget.coords.lng], 19, {
            animate: true,
            duration: 1,
          });
        openBottomSheet(routeTarget);
      });

      tripFromBtn.addEventListener("click", () => {
        if (!routeState) return;
        const at =
          routeState.originSource === "gps"
            ? gps.fix && gps.fix.latlng
            : pinnedOrigin &&
              (pinnedOrigin.door
                ? pinnedOrigin.door.latlng
                : pinnedOrigin.building.coords);
        if (at)
          oc_map.flyTo([at.lat, at.lng], 19, { animate: true, duration: 1 });
      });

      /* ==========================================================
           Starting point from a QR code or "Start from here" (location off)
           ========================================================== */
      function normalizeKey(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "");
      }

      function findBuilding(raw) {
        const wanted = normalizeKey(raw);
        if (!wanted) return null;
        return (
          campusBuildings.find(
            (b) =>
              normalizeKey(b.title) === wanted || normalizeKey(b.id) === wanted,
          ) || null
        );
      }

      /* "2", "entrance2" and "Entrance 2" all mean the second door */
      function findDoorIndex(building, raw) {
        if (!raw) return -1;
        const key = normalizeKey(raw);
        const byName = building.doors.findIndex(
          (d) => normalizeKey(d.name) === key,
        );
        if (byName >= 0) return byName;
        const n = parseInt(key.replace(/^entrance/, ""), 10);
        return Number.isInteger(n) && n >= 1 && n <= building.doors.length
          ? n - 1
          : -1;
      }

      function setPinnedOrigin(
        building,
        { source = "manual", doorIndex = -1, fly = true } = {},
      ) {
        clearRoute();
        pendingTarget = null;

        const door = doorIndex >= 0 ? building.doors[doorIndex] : null;
        pinnedOrigin = {
          source,
          building,
          door,
          points: door ? [door.latlng] : building.entrances,
        };

        if (hereMarker) oc_map.removeLayer(hereMarker);
        hereMarker = null;
        const at = door ? door.latlng : building.coords;
        if (at) {
          hereMarker = L.marker(at, {
            interactive: false,
            keyboard: false,
            zIndexOffset: -1000,
            icon: HERE_ICON,
          }).addTo(oc_map);
          if (fly)
            oc_map.flyTo([at.lat, at.lng], 19, {
              animate: true,
              duration: 1.2,
            });
        }

        storeSet(
          ORIGIN_KEY,
          JSON.stringify({
            key: building.id || building.title,
            door: door ? door.name : null,
            source,
          }),
        );
        updateHereChip();
        applyHighlights();
        refreshSheetActions();
      }

      function stripOriginFromUrl() {
        try {
          if (window.location.search) {
            history.replaceState(
              null,
              "",
              window.location.pathname + window.location.hash,
            );
          }
        } catch (e) {}
      }

      function clearPinnedOrigin() {
        pinnedOrigin = null;
        if (hereMarker) oc_map.removeLayer(hereMarker);
        hereMarker = null;
        storeRemove(ORIGIN_KEY);
        stripOriginFromUrl();
        clearRoute();
        updateHereChip();
        applyHighlights();
        refreshSheetActions();
      }

      clearOriginBtn.addEventListener("click", () => {
        const o = getOrigin();
        if (o && o.source !== "gps") clearPinnedOrigin();
        else if (gps.watchId !== null) stopLocation();
        else if (pinnedOrigin) clearPinnedOrigin();
      });

      startHereBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const b = activeBuildingData;
        if (!b) return;
        setPinnedOrigin(b, { source: "manual", fly: false });
        showToast(
          `Starting point set to ${b.title}. Now pick where you want to go.`,
        );
      });

      /* ==========================================================
           Live location (location on)
           ========================================================== */
      function locationSupported(announce) {
        if (!("geolocation" in navigator)) {
          if (announce) showToast("This browser does not support location.");
          return false;
        }
        if (window.isSecureContext === false) {
          if (announce)
            showToast("Location only works on a secure (https) page.");
          return false;
        }
        return true;
      }

      const follow = { on: false, dismissed: false, flyUntil: 0 };
      const heading = {
        value: null, // smoothed compass bearing, degrees clockwise from north
        target: null,
        ui: 0, // unwrapped angle given to the CSS, so the beam never spins the long way round
        offset: 0, // north-on-screen minus icon rotation, measured from the DOM
        raf: 0,
        lastCompassAt: 0,
        listening: false,
        evt: null,
        tapHooked: false,
      };
      let northRef = null;
      let moveAnim = 0;
      let measureRaf = 0;

      function angleDiff(a, b) {
        return ((((a - b) % 360) + 540) % 360) - 180;
      }

      function northOf(ll) {
        return L.latLng(ll.lat + 40 / KY, ll.lng);
      }

      /* Where the dot is drawn: pinned to the walkway while navigating, otherwise the raw fix */
      function userDisplayLatLng() {
        return routeState && routeState.originSource === "gps" && navDot
          ? navDot
          : gps.fix.latlng;
      }

      function placeUser(ll) {
        userMarker.setLatLng(ll);
        if (northRef) northRef.setLatLng(northOf(ll));
      }

      /* Glide from one fix to the next instead of jumping, so the dot walks with the person */
      function moveUserMarker(to) {
        cancelAnimationFrame(moveAnim);
        const from = userMarker.getLatLng();
        const dist = from.distanceTo(to);
        if (dist < 0.2 || dist > 80) {
          placeUser(to);
          scheduleMeasure();
          return;
        }
        const t0 = performance.now();
        const dur = 900;
        const step = (now) => {
          const k = Math.min(1, (now - t0) / dur);
          placeUser(
            L.latLng(
              from.lat + (to.lat - from.lat) * k,
              from.lng + (to.lng - from.lng) * k,
            ),
          );
          if (k < 1) moveAnim = requestAnimationFrame(step);
          else scheduleMeasure();
        };
        moveAnim = requestAnimationFrame(step);
      }

      function drawUserMarker() {
        if (!gps.fix) return;
        const at = userDisplayLatLng();
        const radius = Math.min(gps.fix.accuracy, 150);
        if (!userMarker) {
          userMarker = L.marker(at, {
            icon: USER_ICON,
            interactive: false,
            keyboard: false,
            zIndexOffset: 900,
          }).addTo(oc_map);
          northRef = L.marker(northOf(at), {
            icon: NORTH_REF_ICON,
            interactive: false,
            keyboard: false,
            zIndexOffset: -2000,
          }).addTo(oc_map);
          accuracyCircle = L.circle(gps.fix.latlng, {
            radius,
            color: "#4285f4",
            weight: 1,
            fillColor: "#4285f4",
            fillOpacity: 0.12,
            interactive: false,
          }).addTo(oc_map);
        } else {
          moveUserMarker(at);
          accuracyCircle.setLatLng(gps.fix.latlng);
          accuracyCircle.setRadius(radius);
        }
        followCamera(at);
        scheduleMeasure();
      }

      function removeUserMarker() {
        cancelAnimationFrame(moveAnim);
        if (userMarker) oc_map.removeLayer(userMarker);
        if (northRef) oc_map.removeLayer(northRef);
        if (accuracyCircle) oc_map.removeLayer(accuracyCircle);
        userMarker = northRef = accuracyCircle = null;
      }

      /* ---- Direction beam (compass) ---- */
      /* Screen angles are measured from the DOM, so the beam is right whether or not the
         rotate plugin turns marker icons with the map. */
      function measureNorth() {
        measureRaf = 0;
        if (!userMarker || !northRef) return;
        const el = userMarker.getElement();
        const ref = northRef.getElement();
        if (!el || !ref) return;
        const c = el.querySelector(".gm-center");
        const a = el.querySelector(".gm-axis");
        if (!c || !a) return;
        const mid = (node) => {
          const r = node.getBoundingClientRect();
          return [r.left + r.width / 2, r.top + r.height / 2];
        };
        const [cx, cy] = mid(c);
        const [ax, ay] = mid(a);
        const [nx, ny] = mid(ref);
        const psi = (Math.atan2(ax - cx, -(ay - cy)) * 180) / Math.PI; // icon rotation
        const phi = (Math.atan2(nx - cx, -(ny - cy)) * 180) / Math.PI; // north on screen
        if (isFinite(psi) && isFinite(phi)) heading.offset = phi - psi;
        renderBeam();
      }

      function scheduleMeasure() {
        if (!measureRaf) measureRaf = requestAnimationFrame(measureNorth);
      }

      function renderBeam() {
        if (heading.value === null || !userMarker) return;
        const el = userMarker.getElement();
        if (!el) return;
        heading.ui += angleDiff(heading.value + heading.offset, heading.ui);
        el.style.setProperty("--gm-heading", heading.ui.toFixed(1) + "deg");
        el.classList.add("has-heading");
      }

      function applyHeading() {
        heading.raf = 0;
        if (heading.value === null) heading.value = heading.target;
        else
          heading.value =
            (heading.value +
              angleDiff(heading.target, heading.value) * 0.35 +
              360) %
            360;
        renderBeam();
      }

      function feedHeading(deg, source) {
        const now = Date.now();
        if (source === "compass") heading.lastCompassAt = now;
        else if (now - heading.lastCompassAt < 3000) return; // compass is better while it works
        heading.target = ((deg % 360) + 360) % 360;
        if (!heading.raf) heading.raf = requestAnimationFrame(applyHeading);
      }

      /* Compass bearing of the direction the phone is facing, corrected for tilt (W3C method) */
      function tiltCompassHeading(alpha, beta, gamma) {
        const r = Math.PI / 180;
        const cA = Math.cos(alpha * r),
          sA = Math.sin(alpha * r),
          sB = Math.sin(beta * r),
          cB = Math.cos(beta * r),
          cG = Math.cos(gamma * r),
          sG = Math.sin(gamma * r);
        const rA = -cA * sG - sA * sB * cG;
        const rB = -sA * sG + cA * sB * cG;
        if (Math.abs(rA) < 1e-6 && Math.abs(rB) < 1e-6)
          return (360 - alpha) % 360;
        return ((Math.atan2(rA, rB) * 180) / Math.PI + 360) % 360;
      }

      function onOrientation(e) {
        let h = null;
        if (
          typeof e.webkitCompassHeading === "number" &&
          !isNaN(e.webkitCompassHeading)
        ) {
          h = e.webkitCompassHeading; // iPhone: already clockwise from north
        } else if (
          typeof e.alpha === "number" &&
          (e.absolute || e.type === "deviceorientationabsolute")
        ) {
          h =
            typeof e.beta === "number" && typeof e.gamma === "number"
              ? tiltCompassHeading(e.alpha, e.beta, e.gamma)
              : (360 - e.alpha) % 360;
        }
        if (h === null) return;
        const screenAngle =
          (screen.orientation && screen.orientation.angle) || 0;
        feedHeading(h + screenAngle, "compass");
      }

      function enableCompass() {
        if (heading.listening || !window.DeviceOrientationEvent) return;
        const evt =
          "ondeviceorientationabsolute" in window
            ? "deviceorientationabsolute"
            : "deviceorientation";
        const start = () => {
          if (heading.listening) return;
          heading.listening = true;
          heading.evt = evt;
          window.addEventListener(evt, onOrientation, true);
        };
        const DOE = window.DeviceOrientationEvent;
        if (typeof DOE.requestPermission === "function") {
          // iOS only allows this from a tap; outside a tap it simply fails quietly
          DOE.requestPermission()
            .then((state) => {
              if (state === "granted") start();
            })
            .catch(() => {});
        } else {
          start();
        }
      }

      function stopCompass() {
        if (heading.listening && heading.evt)
          window.removeEventListener(heading.evt, onOrientation, true);
        heading.listening = false;
        heading.value = heading.target = null;
        heading.ui = 0;
      }

      oc_map.on("move zoom rotate", scheduleMeasure);

      /* ---- Camera follows the walker while navigating ---- */
      function updateLocBtn() {
        const btn = $("myLocationBtn");
        btn.classList.toggle("active", follow.on);
        btn.setAttribute("aria-pressed", String(follow.on));
        btn.title = follow.on ? "Following your location" : "Go to my location";
      }

      function startFollow() {
        if (!gps.fix) return;
        follow.on = true;
        follow.dismissed = false;
        follow.flyUntil = Date.now() + 900;
        updateLocBtn();
        oc_map.flyTo(
          userDisplayLatLng(),
          Math.max(oc_map.getZoom(), FOLLOW_ZOOM),
          { animate: true, duration: 0.8 },
        );
      }

      function stopFollow() {
        if (!follow.on) return;
        follow.on = false;
        updateLocBtn();
      }

      function followCamera(at) {
        if (!follow.on || Date.now() < follow.flyUntil) return;
        oc_map.panTo(at, {
          animate: true,
          duration: 0.9,
          easeLinearity: 1,
          noMoveStart: true,
        });
      }

      /* Dragging the map by hand lets go of the walker (tap the crosshair to follow again) */
      oc_map.on("dragstart", () => {
        if (follow.on) {
          stopFollow();
          follow.dismissed = true;
        }
      });

      /* Once the walker actually starts moving, switch from the route overview to following them */
      function autoFollow(at) {
        if (follow.on || follow.dismissed || !routeState || !routeState.began)
          return;
        if (routeState.began.distanceTo(at) >= 4) startFollow();
      }

      /* Keep an active route in step with the walker: the line shrinks as they walk */
      function maybeReroute() {
        if (!routeState) return;
        const origin = getOrigin();
        if (!origin || origin.source !== "gps") return; // QR / manual routes are fixed
        const switching = routeState.originSource !== "gps"; // live location just took over from the QR building
        if (
          !switching &&
          routeState.from &&
          routeState.from.distanceTo(origin.latlng) < ROUTE_REFRESH_M
        )
          return;

        const target = routeState.target;
        const result = computeRoute(origin, target);
        if (result.error) return;
        drawRoute(result.route, origin, target, false);
        checkArrival(result.route, target);
        autoFollow(origin.latlng);
      }

      function onGpsFix(position) {
        const c = position.coords;
        gps.fix = {
          latlng: L.latLng(c.latitude, c.longitude),
          accuracy: c.accuracy || 9999,
          time: Date.now(),
        };
        if (typeof c.heading === "number" && !isNaN(c.heading) && c.speed > 0.8)
          feedHeading(c.heading, "gps");

        refreshOriginMode();

        if (gps.recenter) {
          gps.recenter = false;
          if (gpsOnCampus() || !pinnedOrigin)
            oc_map.flyTo(gps.fix.latlng, Math.max(oc_map.getZoom(), 18), {
              animate: true,
              duration: 1.2,
            });
        }

        if (pendingTarget && getOrigin()) {
          const target = pendingTarget;
          pendingTarget = null;
          routeTo(target);
        } else if (pendingTarget && !gpsIsUsable() && !gps.weakNotified) {
          gps.weakNotified = true;
          showToast(
            `GPS signal is weak (±${Math.round(gps.fix.accuracy)} m). Waiting for a better fix, or scan a QR code / tap “Start from here”.`,
          );
        } else {
          maybeReroute();
        }

        drawUserMarker();
        updateHereChip();
      }

      function onGpsError(error) {
        if (error.code === error.PERMISSION_DENIED) {
          gps.denied = true;
          stopLocation({ remember: false });
          locMode = "off";
          storeSet(LOC_MODE_KEY, "off");
          showToast(
            "Location is blocked for this site. Allow it in your browser settings, or scan a QR code instead.",
          );
          return;
        }
        const now = Date.now();
        if (now - gps.lastErrorAt < 15000) return;
        gps.lastErrorAt = now;
        showToast(
          error.code === error.POSITION_UNAVAILABLE
            ? "No location signal. Turn on Location / GPS on your device."
            : "Still looking for your location…",
        );
      }

      function startLocation({ recenter = false } = {}) {
        if (!locationSupported(true) || gps.watchId !== null) return;
        gps.denied = false;
        gps.recenter = recenter;
        locMode = "on";
        storeSet(LOC_MODE_KEY, "on");
        storeRemove(GPS_OFF_KEY);
        enableCompass();
        if (!heading.tapHooked) {
          heading.tapHooked = true;
          document.addEventListener("click", enableCompass); // iPhones ask for the compass on a tap
        }
        gps.watchId = navigator.geolocation.watchPosition(
          onGpsFix,
          onGpsError,
          {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 20000,
          },
        );
        updateHereChip();
      }

      function stopLocation({ remember = true } = {}) {
        if (gps.watchId !== null) navigator.geolocation.clearWatch(gps.watchId);
        gps.watchId = null;
        gps.fix = null;
        gps.recenter = false;
        pendingTarget = null;
        navDot = null;
        stopFollow();
        stopCompass();
        removeUserMarker();
        if (routeState && routeState.originSource === "gps") clearRoute();
        if (remember) {
          locMode = "off";
          storeSet(LOC_MODE_KEY, "off");
          storeSet(GPS_OFF_KEY, "1");
        }
        refreshOriginMode();
        updateHereChip();
      }

      $("myLocationBtn").addEventListener("click", () => {
        enableCompass();
        if (gps.watchId === null) {
          startLocation({ recenter: true });
          return;
        }
        if (!gps.fix) {
          showToast("Still finding your location…");
          return;
        }
        if (routeState && routeState.originSource === "gps") {
          startFollow();
          return;

        oc_map.flyTo(gps.fix.latlng, Math.max(oc_map.getZoom(), 18), {

        if (pinnedOrigin && pinnedOrigin.source === "manual") {

      /* If the browser already allows location, start without asking again */
      function autoStartLocation() {
        if (storeGet(GPS_OFF_KEY) === "1" || !locationSupported(false)) return;
        if (!navigator.permissions || !navigator.permissions.query) return;
        navigator.permissions

      /* ==========================================================
           Start-up: QR code in the URL, or the starting point from earlier in this tab
           ========================================================== */
      function initRouting() {
        const params = new URLSearchParams(window.location.search);

        /* The index page tells us what the visitor chose: location on or off */
        const locParam = params.get("loc");
        if (locParam === "on" || locParam === "off") {
          locMode = locParam;
          storeSet(LOC_MODE_KEY, locParam);
        } else {
          locMode = storeGet(LOC_MODE_KEY);
        }

        const raw =
          params.get("from") ||
          params.get("start") ||
          params.get("here") ||
          params.get("destination");

        let wanted = null;
        if (raw) {
          wanted = {
            key: raw,
            door: params.get("entrance") || params.get("door"),
            source: "qr",
            fromUrl: true,
          };
        } else {
          try {
            const saved = JSON.parse(storeGet(ORIGIN_KEY) || "null");
            if (saved && saved.key)
              wanted = {
                key: saved.key,
                door: saved.door,
                source: saved.source || "manual",
                fromUrl: false,
              };
          } catch (e) {}
        }

        if (wanted) {
          const building = findBuilding(wanted.key);
          if (building) {
            setPinnedOrigin(building, {
              source: wanted.source,
              doorIndex: findDoorIndex(building, wanted.door),
              fly: true,
            });
          } else if (wanted.fromUrl) {
            showToast(`Could not find “${wanted.key}” on the map.`);
          }
        }

        /* Location on: live position takes over from the QR building as soon as it is accurate.
           Location off: the QR building is the starting point and GPS stays off (the crosshair turns it on). */
        if (locMode === "on") startLocation({ recenter: true });
        else if (locMode !== "off") autoStartLocation();

        /* The QR/index params are consumed: drop them from the address bar so a refresh
           (or a later "Start from here" choice) is not overridden by the old ?from=.
           The mode and starting point are already saved for this tab. */
        if (window.location.search && storeGet(LOC_MODE_KEY))
          stripOriginFromUrl();
