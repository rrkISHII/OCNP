<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Olivarez Navigation Portal</title>

    <!-- Entry gate: sends every first visit through index.html so the visitor
         always chooses location on / off first. Runs before the page draws. -->
    <script src="js/entry-gate.js"></script>

    <!-- Leaflet (the map library) stylesheet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Leaflet Rotate plugin stylesheet (lets the map be turned by touch) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.css"
    />

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- This page's own styles -->
    <link rel="stylesheet" href="css/design.css" />
  </head>
  <body>
    <!-- Search bar at the top of the screen: hamburger menu button, search box and the dropdown of buildings.
         While a route is showing, the trip card replaces the search bar.
    -->
    <header class="app-header" id="appHeader" data-mode="search">
      <div class="header-search" id="headerSearch">
        <!-- Hamburger button: opens the side drawer. -->
        <button
          type="button"
          class="menu-btn"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="sideDrawer"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <!-- Search box and its button (the button clears the text). -->
        <div class="search-container">
          <input
            type="search"
            class="search-input"
            id="searchInput"
            placeholder="Search location..."
            aria-label="Search map"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="buildingsList"
          />
          <button
            type="button"
            class="search-btn"
            id="searchBtn"
            aria-label="Search"
          >
            <i
              class="fa-solid fa-magnifying-glass"
              id="searchIcon"
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>

      <!-- Trip card: shown instead of the search bar while a route is displayed.
           Back arrow ends the route; tap the From / To rows to look at either end; time and distance are on the right.
      -->
      <section
        class="trip-card"
        id="tripCard"
        data-origin="pin"
        aria-label="Walking route"
      >
        <button
          type="button"
          class="trip-back"
          id="tripBackBtn"
          aria-label="Clear route"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>
        <div class="trip-points">
          <button type="button" class="trip-row" id="tripFromBtn">
            <span class="trip-marker"><span class="trip-dot"></span></span
            ><span class="sr-only">From: </span
            ><span class="trip-text" id="tripFromText">Your location</span>
          </button>
          <button type="button" class="trip-row trip-row-to" id="tripToBtn">
            <span class="trip-marker"
              ><i
                class="fa-solid fa-flag-checkered"
                aria-hidden="true"
              ></i></span
            ><span class="sr-only">To: </span
            ><span class="trip-text" id="tripToText">Destination</span>
          </button>
        </div>
        <div class="trip-summary">
          <span class="trip-time" id="tripTime">1 min</span
          ><span class="trip-dist" id="tripDist">0 m</span>
        </div>
      </section>

      <!-- Dropdown list of buildings (and rooms that match what was typed). Filled in by main_page.js, alphabetically. -->
      <div class="search-dropdown" id="searchDropdown">
        <ul
          class="buildings-list"
          id="buildingsList"
          role="listbox"
          aria-label="Campus locations"
        ></ul>
      </div>
    </header>

    <!-- Where you start (QR / location). The route itself lives in the trip card above. -->
    <div class="status-stack" id="statusStack">
      <div class="status-chip here-chip" id="hereChip" hidden>
        <i
          class="fa-solid fa-location-dot"
          id="hereChipIcon"
          aria-hidden="true"
        ></i>
        <span id="hereChipText"></span>
        <button
          type="button"
          id="clearOriginBtn"
          aria-label="Clear starting point"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- Hidden text announced by screen readers when a route is found. -->
    <div
      class="sr-only"
      id="routeAnnouncer"
      role="status"
      aria-live="polite"
    ></div>

    <!-- Short pop-up messages such as "Finding your location…". -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Side drawer (hamburger menu) and the dark overlay behind it. Holds the theme toggle, Feedback, About and Attributions. -->
    <div class="nav-overlay" id="navOverlay"></div>
    <nav class="side-drawer" id="sideDrawer" aria-label="Main menu">
      <div class="drawer-header">
        <h2>OCNP</h2>
        <button
          type="button"
          class="close-btn"
          id="closeDrawer"
          aria-label="Close menu"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <ul class="drawer-menu">
        <li>
          <button type="button" id="themeToggleBtn">
            <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
            <span id="themeLabel">Dark Mode</span>
          </button>
        </li>
        <li>
          <button type="button" id="feedbackLink">
            <i class="fa-solid fa-envelope-open" aria-hidden="true"></i>Feedback
          </button>
        </li>
        <li>
          <button type="button" id="aboutLink">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>About Us /
            Contact Us
          </button>
        </li>
        <li>
          <button type="button" id="attributionsLink">
            <i class="fa-solid fa-users" aria-hidden="true"></i>Attributions
          </button>
        </li>
      </ul>
    </nav>

    <!-- Feedback popup: email, subject and message, sent with emailjs. -->
    <div class="modal-overlay" id="feedbackModal">
      <div
        class="feedback-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="feedbackTitle"
      >
        <div class="modal-header">
          <h3 id="feedbackTitle">
            <i class="fa-solid fa-comments" aria-hidden="true"></i> Send
            Feedback
          </h3>
          <button
            type="button"
            class="modal-close-btn"
            id="closeFeedbackBtn"
            aria-label="Close feedback"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <form id="feedbackForm">
          <div class="form-group">
            <label for="userEmail"
              ><i class="fa-regular fa-envelope" aria-hidden="true"></i>
              Email</label
            >
            <input
              type="email"
              id="userEmail"
              class="form-input"
              placeholder="Enter your email here."
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="feedbackSubject"
              ><i class="fa-solid fa-tag" aria-hidden="true"></i> Subject</label
            >
            <input
              type="text"
              id="feedbackSubject"
              class="form-input"
              placeholder="Enter subject here."
              required
            />
          </div>

          <div class="form-group">
            <label for="feedbackMessage"
              ><i class="fa-solid fa-message" aria-hidden="true"></i>
              Feedback</label
            >
            <textarea
              id="feedbackMessage"
              class="form-textarea"
              placeholder="Enter your feedback here."
              rows="4"
              required
            ></textarea>
          </div>

          <button type="submit" class="send-btn" id="sendFeedbackBtn">
            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send
            Feedback
          </button>
        </form>
      </div>
    </div>

    <!-- "Feedback sent" popup. -->
    <div class="modal-overlay" id="successModal">
      <div
        class="success-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="successTitle"
        aria-describedby="successText"
      >
        <div class="success-icon">
          <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        </div>
        <h3 id="successTitle">Feedback Sent!</h3>
        <p id="successText">
          Thank you for helping us improve OCNP. Your message has been sent to
          support.
        </p>
        <button type="button" class="popup-close-btn" id="closeSuccessBtn">
          Close &amp; Return to Map
        </button>
      </div>
    </div>

    <!-- Generic popup used for About Us and Attributions. Its title and text are filled in by main_page.js. -->
    <div class="modal-overlay" id="infoModal">
      <div
        class="feedback-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="infoModalTitle"
      >
        <div class="modal-header">
          <h3 id="infoModalTitle">Info</h3>
          <button
            type="button"
            class="modal-close-btn"
            id="closeInfoBtn"
            aria-label="Close info"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div id="infoModalBody" class="info-modal-body"></div>
      </div>
    </div>

    <!-- The map. Leaflet draws into this element. -->
    <div id="oc_map" role="region" aria-label="Campus map"></div>

    <!-- Buttons at the bottom-right of the map: floor picker, building-label toggle and my-location. -->
    <div class="map-controls-container">
      <div class="floor-control" id="floorControl">
        <!-- Floor menu: M is the plain campus map, F1 to F9 show that floor's rooms. Opens upward from the floor button. -->
        <div
          class="floor-menu"
          id="floorMenu"
          role="radiogroup"
          aria-label="Choose floor"
        >
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="true"
            data-floor="m"
            aria-label="Main floor"
            title="Main"
          >
            M
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f1"
            aria-label="Floor 1"
            title="Floor 1"
          >
            F1
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f2"
            aria-label="Floor 2"
            title="Floor 2"
          >
            F2
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f3"
            aria-label="Floor 3"
            title="Floor 3"
          >
            F3
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f4"
            aria-label="Floor 4"
            title="Floor 4"
          >
            F4
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f5"
            aria-label="Floor 5"
            title="Floor 5"
          >
            F5
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f6"
            aria-label="Floor 6"
            title="Floor 6"
          >
            F6
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f7"
            aria-label="Floor 7"
            title="Floor 7"
          >
            F7
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f8"
            aria-label="Floor 8"
            title="Floor 8"
          >
            F8
          </button>
          <button
            type="button"
            class="floor-chip"
            role="radio"
            aria-checked="false"
            data-floor="f9"
            aria-label="Floor 9"
            title="Floor 9"
          >
            F9
          </button>
        </div>

        <!-- Floor button. The badge on it shows the floor currently selected. -->
        <button
          type="button"
          class="map-control-btn"
          id="floorBtn"
          aria-label="Choose floor"
          aria-haspopup="true"
          aria-expanded="false"
          title="Floors"
        >
          <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
          <span class="floor-badge" id="floorBadge" aria-hidden="true"></span>
        </button>
      </div>

      <!-- Button that shows / hides the building names on the map. -->
      <button
        type="button"
        class="map-control-btn"
        id="toggleLabelsBtn"
        aria-label="Toggle building labels"
        aria-pressed="false"
        title="Toggle building labels"
      >
        <i class="fa-solid fa-font" aria-hidden="true"></i>
      </button>

      <!-- Button that finds and follows your live location. -->
      <button
        type="button"
        class="map-control-btn my-location-btn"
        id="myLocationBtn"
        aria-label="Go to my location"
        title="Go to my location"
      >
        <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Dark layer behind the bottom sheet while it is fully open. Tapping it closes the sheet. -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>

    <!-- Bottom sheet with a building's details. Drag it up to expand, down to close. -->
    <div
      class="bottom-sheet"
      id="bottomSheet"
      role="dialog"
      aria-labelledby="sheetTitle"
      inert
    >
      <!-- Strip that stays visible when the sheet is collapsed: handle, building name, close button, time / distance badges and the Go button. -->
      <div class="sheet-drag-area" id="sheetDragArea">
        <button
          type="button"
          class="sheet-handle-btn"
          id="sheetToggleBtn"
          aria-label="Expand details"
          aria-expanded="false"
          aria-controls="sheetContent"
        >
          <span class="sheet-handle"></span>
        </button>

        <!-- Top row: building name and close button. Bottom row: estimated walking time and distance. -->
        <div class="sheet-header">
          <div class="sheet-header-top">
            <div class="sheet-header-left">
              <h3 id="sheetTitle" tabindex="-1">Building Title</h3>
            </div>
            <button
              type="button"
              class="sheet-close-btn"
              id="closeSheetBtn"
              aria-label="Close details"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="sheet-header-right">
            <span class="sheet-stat-badge" id="sheetTimeBadge" hidden>
              <i class="fa-regular fa-clock" aria-hidden="true"></i>
              <span id="sheetTimeText">0 min</span>
            </span>
            <span class="sheet-stat-badge" id="sheetDistanceBadge" hidden>
              <i class="fa-solid fa-person-walking" aria-hidden="true"></i>
              <span id="sheetDistanceText">0 m</span>
            </span>
            <button
              type="button"
              class="sheet-pill-btn"
              id="startHereBtn"
              hidden
            >
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i> Start
              from here
            </button>
          </div>
        </div>

        <!-- Main action button ("Go to Destination" / "Clear route" / "You are here"). -->
        <button type="button" class="destination-btn" id="goToDestinationBtn">
          <i class="fa-solid fa-location-arrow" aria-hidden="true"></i> Go to
          Destination
        </button>
      </div>

      <!-- Scrollable content: photos, description and room list. -->
      <div class="sheet-content" id="sheetContent">
        <!-- Up to three photos of the building (a placeholder shows when there is no photo). -->
        <div class="sheet-images-gallery" id="sheetImagesGallery">
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 1</span>
            </div>
            <img id="sheetImage1" alt="" />
          </div>
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 2</span>
            </div>
            <img id="sheetImage2" alt="" />
          </div>
          <div class="sheet-image-box">
            <div class="sheet-placeholder-text">
              <i class="fa-solid fa-image" aria-hidden="true"></i>
              <span>Photo 3</span>
            </div>
            <img id="sheetImage3" alt="" />
          </div>
        </div>

        <!-- Building description. -->
        <p class="sheet-description" id="sheetDescription">
          Building description text goes here...
        </p>

        <!-- Floor-by-floor room dropdowns, shown for buildings that have a directory. -->
        <div class="floor-list" id="floorList" hidden></div>
      </div>
    </div>

    <!-- Libraries: Leaflet, its rotate plugin and emailjs (for the feedback form) -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@0.3.0/dist/leaflet-rotate.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.12.1/dist/email.min.js"></script>

    <!-- Map data: campus buildings and paths, room directory, floor plans.
         These must load before main_page.js, which uses them. -->
    <script src="js/campus-geojson.js"></script>
    <script src="js/building-directory.js"></script>
    <script src="js/floor-plans.js"></script>

    <!-- Page logic: map, search, routing, live location, floors, popups -->
    <script src="js/main_page.js"></script>
  </body>
</html>
